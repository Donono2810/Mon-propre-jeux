name: CI

on:
  pull_request:
  push:

jobs:
  lua-syntax-check:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax-check all Lua files
        run: |
          set -e
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p

      - name: Verify LICENSE file exists
        run: |
          if [ -f LICENSE ] || [ -f LICENSE.md ] || [ -f licence ]; then
            echo "LICENSE file found"
            exit 0
          fi
          # try README for license mention
          if grep -i -E "(mit|apache|gpl|bsd|licen[cs]e|spdx)" README.md >/dev/null 2>&1; then
            echo "License reference found in README"
            exit 0
          fi
          echo "ERROR: No LICENSE file or reference found. Add a LICENSE file to the repository." >&2
          exit 1
