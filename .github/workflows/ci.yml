name: CI

on:
  pull_request:
  push:

jobs:
  lua-syntax-check:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax-check all Lua files
        run: |
          set -e
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p

      - name: Verify LICENSE file exists
        run: |
          if [ -f LICENSE ] || [ -f LICENSE.md ] || [ -f licence ]; then
            echo "LICENSE file found"
            exit 0
          fi
          # try README for license mention
          if grep -i -E "(mit|apache|gpl|bsd|licen[cs]e|spdx)" README.md >/dev/null 2>&1; then
            echo "License reference found in README"
            exit 0
          fi
          echo "ERROR: No LICENSE file or reference found. Add a LICENSE file to the repository." >&2
          exit 1

  pr-guard:
    name: PR Guard (Required checklist)
    runs-on: ubuntu-latest
    needs: lua-syntax-check
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR required checklist
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request || {}
            const body = pr.body || ''
            const required = [
              'CI:',
              'Licence:',
              'Documentation:',
              'Tests manuels:',
              'Pas de code de debug',
              'Data persistence:',
              'Approval:'
            ]

            function escapeForRegex(s) { return s.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&') }

            const missing = required.filter(k => {
              const re = new RegExp(`- \\\[([xX])\\\][^\\n]*${escapeForRegex(k)}`,'i')
              return !re.test(body)
            })

            if (missing.length > 0) {
              throw new Error(`Required checklist items not all checked: ${missing.join(', ')}`)
            }
            console.log('PR checklist: all required items checked.')
